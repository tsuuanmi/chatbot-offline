name: chatbot-offline

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    pull_policy: never

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./runtime/secrets/postgres_password:/run/secrets/postgres_password:ro,z

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true


  db-migrate:
    profiles:
      - tools

    image: ${POSTGRES_IMAGE}
    pull_policy: never

    entrypoint:
      - /bin/sh
      - /database/migrate.sh

    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    volumes:
      - ./database:/database:ro,z
      - ./runtime/secrets/postgres_password:/run/secrets/postgres_password:ro,z

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"
    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true


  index-knowledge:
    profiles:
      - tools

    image: ${CHATBOT_IMAGE}
    pull_policy: never

    entrypoint:
      - python
      - /app/tools/index_knowledge.py

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-4}
      FASTEMBED_CACHE_PATH: /opt/models/fastembed

    volumes:
      - ./data/documents:/data:ro,z
      - ./runtime/secrets/postgres_password:/run/secrets/postgres_password:ro,z

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

    security_opt:
      - no-new-privileges:true


  llama-server:
    image: ${LLAMA_CPU_IMAGE}
    pull_policy: never

    command:
      - -m
      - /models/${LLAMA_MODEL_NAME}
      - --alias
      - ${LLAMA_MODEL_ALIAS}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${LLAMA_CTX_SIZE:-8192}
      - --threads
      - ${LLAMA_THREADS:-8}
      - --threads-batch
      - ${LLAMA_THREADS:-8}
      - --n-gpu-layers
      - "0"
      - --parallel
      - "1"
      - --jinja
      - --reasoning
      - "off"

    environment:
      LLAMA_ARG_API_KEY_FILE: /run/secrets/llama_api_key

    volumes:
      - ${MODEL_DIR}:/models:ro,z
      - ./runtime/secrets/llama_api_key:/run/secrets/llama_api_key:ro,z

    expose:
      - "8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8080/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 20s

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true


  chatbot:
    image: ${CHATBOT_IMAGE}
    pull_policy: never

    environment:
      HAYHOOKS_HOST: 0.0.0.0
      HAYHOOKS_PORT: "1416"
      HAYHOOKS_PIPELINES_DIR: /app/pipelines
      HAYHOOKS_SHOW_TRACEBACKS: "false"
      LOG: INFO

      LLAMA_BASE_URL: http://llama-server:8080/v1
      LLAMA_API_KEY_FILE: /run/secrets/llama_api_key
      LLAMA_MODEL_ALIAS: ${LLAMA_MODEL_ALIAS}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-4}
      FASTEMBED_CACHE_PATH: /opt/models/fastembed

      CHAT_OWNER_ID: ${CHAT_OWNER_ID:-local-development}
      HISTORY_TURN_LIMIT: ${HISTORY_TURN_LIMIT:-6}
      HISTORY_CHAR_LIMIT: ${HISTORY_CHAR_LIMIT:-8000}
      CHAT_MESSAGE_MAX_CHARS: ${CHAT_MESSAGE_MAX_CHARS:-8000}

    volumes:
      - ./pipelines:/app/pipelines:ro,z
      - ./data/documents:/app/data/documents:ro,z
      - ./runtime/secrets/llama_api_key:/run/secrets/llama_api_key:ro,z
      - ./runtime/secrets/postgres_password:/run/secrets/postgres_password:ro,z

    ports:
      - "127.0.0.1:1416:1416"

    depends_on:
      postgres:
        condition: service_healthy
      llama-server:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.Request('http://127.0.0.1:1416/healthcheck/run', data=b'{}', headers={'Content-Type':'application/json'}); urllib.request.urlopen(r, timeout=5).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true


volumes:
  postgres_data:
